<div *ngIf="{} as asyncData">
    <mat-grid-list rowHeight="fit" gutterSize="15px" cols="6">
        <mat-grid-tile colspan="6">
            <input
                type="file"
                class="file-input"
                [accept]="requiredFileType"
                (change)="onFileSelected($event)"
                #fileUpload
            />
            <button (click)="onUploadInitiated()">Upload</button>

            <div class="file-upload">
                {{ fileName || "No file uploaded yet." }}

                <button
                    mat-mini-fab
                    color="primary"
                    class="upload-btn"
                    (click)="fileUpload.click()"
                >
                    <mat-icon>attach_file</mat-icon>
                </button>
            </div>

            <div class="progress">
                <mat-progress-bar
                    class="progress-bar"
                    mode="determinate"
                    [value]="uploadProgress"
                    *ngIf="uploadProgress"
                >
                </mat-progress-bar>

                <mat-icon class="cancel-upload" (click)="cancelUpload()" *ngIf="uploadProgress"
                    >delete_forever</mat-icon
                >
            </div>
        </mat-grid-tile>
    </mat-grid-list>
</div>
