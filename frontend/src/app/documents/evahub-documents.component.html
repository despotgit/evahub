<div
    *ngIf="{
        selectedDocument: selectedDocument$ | async,
        displayGraph: displayGraph$ | async
    } as asyncData"
>
    <mat-grid-list rowHeight="fit" gutterSize="15px" cols="6">
        <mat-grid-tile colspan="6">
            <div *ngIf="asyncData.displayGraph" class="chart-container">
                <app-documents-graph
                    [graphLabels]="graphLabels"
                    [graphValues]="graphValues"
                ></app-documents-graph>
            </div>
            <div *ngIf="!asyncData.displayGraph" class="text-document">
                <div class="doc">
                    {{
                        asyncData && asyncData.selectedDocument
                            ? asyncData.selectedDocument.getDocumentContent()
                            : ""
                    }}
                </div>
            </div>
        </mat-grid-tile>
    </mat-grid-list>
</div>
