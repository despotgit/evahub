<div
    *ngIf="{
        sd: selectedDocument$ | async,
        displayGraph: displayGraph$ | async,
        shouldDisplaySpinner: shouldDisplaydocumentSpinner$ | async,
        datasets: graphDatasets$ | async,
        dcd: dcd$ | async,
        currentDocumentType: currentDocumentType$ | async,
        isInDocumentUploadMode: isInDocumentUploadMode$ | async,
        isInNewProjectCreationMode: isInNewProjectCreationMode$ | async,
        isInNewReportTemplateMode: isInNewReportTemplateMode$ | async,
        username: username$ | async,
        logs: logs$ | async,
        cdts: currentDocumentTypeString$ | async,
        projectLogs: projectLogs$ | async,
        isEmptyDocumentPage: isEmptyDocumentPage$ | async
    } as asyncData"
>
    <mat-grid-list rowHeight="fit" gutterSize="15px" cols="6">
        <mat-grid-tile colspan="6">
            {{ sig() }}
            {{ derivedSig() }}
            <button (click)="fja()">FJA BOTONCINO</button>
            <ng-container *ngIf="!asyncData.isEmptyDocumentPage">
                <div *ngIf="asyncData.isInNewReportTemplateMode">
                    <app-document-new-report-template [derivedSig]="derivedSig()">
                    </app-document-new-report-template>
                </div>
                <div *ngIf="asyncData.isInDocumentUploadMode || asyncData.isInNewProjectCreationMode">
                    <evahub-document-upload-form-component *ngIf="asyncData.isInDocumentUploadMode">
                    </evahub-document-upload-form-component>

                    <evahub-document-new-project-form
                        *ngIf="asyncData.isInNewProjectCreationMode"
                        [username]="asyncData.username"
                        [logs]="asyncData.logs"
                    >
                    </evahub-document-new-project-form>
                </div>
                <div
                    *ngIf="
                        !asyncData.isInNewReportTemplateMode &&
                        !asyncData.isInDocumentUploadMode &&
                        !asyncData.isInNewProjectCreationMode
                    "
                >
                    <div *ngIf="asyncData.displayGraph" class="document-graph">
                        <evahub-graph-controls
                            [datasets]="asyncData.datasets"
                            (graphDatasetChange)="onGraphDatasetChange($event)"
                        ></evahub-graph-controls>

                        <app-documents-graph
                            [graphLabels]="graphLabels"
                            [graphValues]="graphValues"
                        ></app-documents-graph>
                    </div>
                    <div *ngIf="!asyncData.displayGraph" class="document-text">
                        <ng-container *ngIf="asyncData.cdts == 'project'">
                            <app-documents-project
                                [projectLogs]="asyncData.projectLogs"
                                [projectName]="asyncData.sd ? asyncData.sd.projectName : ''"
                                [projectDescription]="asyncData.sd ? asyncData.sd.projectDescription : ''"
                            >
                            </app-documents-project>
                        </ng-container>

                        <ng-container *ngIf="asyncData.cdts != 'project'">
                            <app-documents-text
                                [documentContent]="asyncData.sd ? asyncData.sd.getDocumentContent() : ''"
                                [shouldDisplaySpinner]="asyncData.shouldDisplaySpinner"
                                (emitContentDisplayed)="onDocumentContentDisplayed()"
                            >
                            </app-documents-text>
                        </ng-container>
                    </div>
                </div>
            </ng-container>
        </mat-grid-tile>
    </mat-grid-list>
</div>
