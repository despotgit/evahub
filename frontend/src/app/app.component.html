<mat-toolbar
    *ngIf="{
        username: username$ | async
    } as asyncData"
>
    <span>EVAHUB</span>

    <button mat-button (click)="gotoHome()">Home</button>
    <button mat-button (click)="gotoLogs()">Logs</button>
    <button mat-button (click)="gotoReports()">Reports</button>
    <button mat-button (click)="gotoChecks()">Checks</button>

    <mat-icon (click)="sidenav.toggle()" aria-hidden="false" aria-label="Home icon">menu</mat-icon>

    <div class="right-pusher"></div>
    <div class="username mat-button">{{ asyncData.username }}</div>
    <button mat-raised-button color="primary" (click)="logOut()">Log out</button>
</mat-toolbar>
<mat-sidenav-container class="main-container">
    <mat-sidenav class="main-sidenav" #sidenav mode="side" [(opened)]="opened">
        <mat-accordion>
            <mat-expansion-panel hideToggle>
                <mat-expansion-panel-header>
                    <mat-panel-title> This is the expansion title </mat-panel-title>
                    <mat-panel-description> This is a summary of the content </mat-panel-description>
                </mat-expansion-panel-header>
                <p>This is the primary content of the panel.</p>
            </mat-expansion-panel>
        </mat-accordion>
    </mat-sidenav>

    <mat-sidenav-content [ngStyle]="{ left: opened ? '1px' : '-3px' }">
        <router-outlet></router-outlet>
    </mat-sidenav-content>
</mat-sidenav-container>
