<mat-toolbar
    *ngIf="{
        username: username$ | async
    } as asyncData"
>
    <span>Power Monitor</span>

    <button mat-button (click)="gotoHome()">Home</button>
    <button mat-button (click)="gotoReports()">Reports</button>

    <mat-icon (click)="sidenav.toggle()" aria-hidden="false" aria-label="Home icon">menu</mat-icon>

    <div>
        <button mat-raised-button color="primary" (click)="logOut()">Log out</button>
        <div>yeah, username: {{ asyncData.username }}</div>
    </div>
</mat-toolbar>
<mat-sidenav-container class="reports-container">
    <mat-sidenav
        class="reports-sidenav"
        #sidenav
        mode="side"
        [(opened)]="opened"
        (opened)="events.push('open!')"
        (closed)="events.push('close!')"
    >
        <div
            *ngIf="{
                reports: userReports$ | async
            } as asyncData"
        >
            <p *ngFor="let report of asyncData.reports">
                <button mat-raised-button color="primary" (click)="userReportSelected(report.reportId)">
                    {{ report.reportName }}
                </button>
                {{ report.reportContent }}
            </p>
        </div>
    </mat-sidenav>

    <!-- <mat-sidenav-content [ngStyle]="{ left: opened ? '1px' : '-3px' }"> -->
    <mat-sidenav-content>
        <router-outlet></router-outlet>
    </mat-sidenav-content>
</mat-sidenav-container>
