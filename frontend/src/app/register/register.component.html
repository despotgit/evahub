<div
    class="register-content-wrapper"
    *ngIf="{
        registerUsername: registerUsername$ | async,
        firstLastname: firstLastName$ | async,
        email: email$ | async
    } as asyncData"
>
    <mat-vertical-stepper class="register-page-stepper" [linear]="false" #stepper>
        <mat-step [stepControl]="step1FormGroup">
            <form [formGroup]="step1FormGroup">
                <ng-template matStepLabel>Fill out your username</ng-template>
                <mat-form-field>
                    <input matInput placeholder="Username" formControlName="usernameFormControl" />
                </mat-form-field>
                <div>
                    <button mat-button matStepperNext>Next</button>
                </div>
            </form>
        </mat-step>

        <mat-step [stepControl]="step2FormGroup">
            <form [formGroup]="step2FormGroup">
                <ng-template matStepLabel>Fill out your name</ng-template>
                <mat-form-field>
                    <input
                        matInput
                        placeholder="Last name, First name"
                        formControlName="firstLastNameFormControl"
                    />
                </mat-form-field>
                <div>
                    <button mat-button matStepperNext>Next</button>
                </div>
            </form>
        </mat-step>

        <mat-step [stepControl]="step3FormGroup">
            <form [formGroup]="step3FormGroup">
                <ng-template matStepLabel>Fill out your email</ng-template>
                <mat-form-field>
                    <input
                        matInput
                        placeholder="Email"
                        formControlName="emailFormControl"
                        value="email"
                        required
                    />
                </mat-form-field>
                <div>
                    <button mat-button matStepperPrevious>Back</button>
                    <button mat-button matStepperNext>Next</button>
                </div>
            </form>
        </mat-step>

        <mat-step>
            <ng-template matStepLabel>Done</ng-template>
            You are now done.
            <div>
                <button mat-button matStepperPrevious>Back</button>
                <button mat-button (click)="stepper.reset()">Reset</button>
                <button mat-button (click)="doneStepper()">Done</button>
            </div>
        </mat-step>
    </mat-vertical-stepper>
</div>
