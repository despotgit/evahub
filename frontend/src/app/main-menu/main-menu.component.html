<div class="main-menu-wrapper">
    <ng-container *ngFor="let mi of mainMenuItems">
        <button
            class="main-menu-item"
            *ngIf="!(mi.pageIndex == pageSelected)"
            mat-button
            color="basic"
            (click)="itemClicked(mi)"
        >
            {{ mi.label }}
        </button>
        <button
            class="main-menu-item"
            *ngIf="mi.pageIndex == pageSelected"
            mat-raised-button
            color="primary"
            (click)="itemClicked(mi)"
        >
            {{ mi.label }}
        </button>
    </ng-container>
    <button class="main-menu-item" *ngIf="isLoggedIn">
        <mat-icon (click)="onToggleSidenavClicked()" aria-hidden="false" aria-label="Home icon">menu</mat-icon>
    </button>
    <!--
    <button class="main-menu-item">
        <mat-icon aria-hidden="false" aria-label="Home icon">menu</mat-icon>
    </button>
    -->
</div>
