<p>home works!</p>
<input type="button"
  (click)="logout()"
  value="Log out">

<div *ngIf="{
  un: username$ | async

} as asyncData1">

  username: {{ asyncData1.un }}
</div>

<mat-vertical-stepper *ngIf="{
  firstLastNameInput: firstLastNameInput$ | async
} as asyncData"
  [linear]="false"
  #stepper>
  <mat-step [stepControl]="step1FormGroup">

    <form [formGroup]="step1FormGroup">
      <ng-template matStepLabel>Fill out your name</ng-template>
      <mat-form-field>
        <input matInput
          placeholder='Last name, First name'
          formControlName='firstLastNameFormControl'>
      </mat-form-field>
      <div>
        <button mat-button
          matStepperNext>Next</button>
      </div>
    </form>
  </mat-step>

  <mat-step>
    <ng-template matStepLabel>Done</ng-template>
    You are now done.
    <div>
      <button mat-button
        matStepperPrevious>Back</button>
      <button mat-button
        (click)="stepper.reset()">Reset</button>
      <button mat-button
        (click)="doneStepper()">Done</button>
    </div>
  </mat-step>
</mat-vertical-stepper>



<!--  EXPANSION  -->
<mat-accordion>
  <mat-expansion-panel hideToggle>
    <mat-expansion-panel-header>
      <mat-panel-title>
        This is the expansion title
      </mat-panel-title>
      <mat-panel-description>
        This is a summary of the content
      </mat-panel-description>
    </mat-expansion-panel-header>
    <p>This is the primary content of the panel.</p>
  </mat-expansion-panel>
  <mat-expansion-panel (opened)="panelOpenState = true"
    (closed)="panelOpenState = false">
    <mat-expansion-panel-header>
      <mat-panel-title>
        Self aware panel
      </mat-panel-title>
      <mat-panel-description>
        Currently I am {{panelOpenState ? 'open' : 'closed'}}
      </mat-panel-description>
    </mat-expansion-panel-header>
    <p>I'm visible because I am open</p>
  </mat-expansion-panel>
</mat-accordion>

<!-- END EXPANSION -->
