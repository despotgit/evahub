<mat-sidenav-container class="example-container" *ngIf="true">
    <mat-sidenav
        #sidenav
        mode="side"
        [(opened)]="opened"
        (opened)="events.push('open!')"
        (closed)="events.push('close!')"
    >
        <div
            *ngIf="{
                reports: userReports$ | async
            } as asyncData"
        >
            <p *ngFor="let report of asyncData.reports">
                <ion-button (click)="userReportSelected(report.reportId)">
                    {{ report.reportName }}
                </ion-button>
                {{ report.reportContent }}
            </p>
        </div>
        <p *ngIf="showFiller">Lorem, ipsum dolor sit amet consectetur.</p>
        <button mat-button (click)="showFiller = !showFiller" mat-raised-button>Toggle extra text</button>
    </mat-sidenav>

    <mat-sidenav-content>
        <p><mat-checkbox [(ngModel)]="opened">sidenav.opened</mat-checkbox></p>
        <p><button mat-button (click)="sidenav.toggle()">sidenav.toggle()</button></p>
        <p>Events:</p>
        <div class="example-events">
            <div *ngFor="let e of events">{{ e }}</div>
        </div>
    </mat-sidenav-content>
</mat-sidenav-container>
