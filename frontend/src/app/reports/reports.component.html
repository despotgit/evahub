<mat-sidenav-container class="reports-container" *ngIf="true">
    <mat-sidenav
        class="reports-sidenav"
        #sidenav
        mode="side"
        [(opened)]="opened"
        (opened)="events.push('open!')"
        (closed)="events.push('close!')"
    >
        <div
            *ngIf="{
                reports: userReports$ | async
            } as asyncData"
        >
            <p *ngFor="let report of asyncData.reports">
                <ion-button (click)="userReportSelected(report.reportId)">
                    {{ report.reportName }}
                </ion-button>
                {{ report.reportContent }}
            </p>
        </div>
        <p *ngIf="showFiller">Lorem, ipsum dolor sit amet consectetur.</p>
        <button mat-button (click)="showFiller = !showFiller" mat-raised-button>Toggle extra text</button>
    </mat-sidenav>

    <mat-sidenav-content>
        <!--
        <p><mat-checkbox [(ngModel)]="opened">sidenav.opened</mat-checkbox></p>
        -->
        <p>
            <button class="toggle-sidenav-button" mat-button (click)="sidenav.toggle()">sidenav.toggle()</button>
        </p>

        <mat-grid-list rowHeight="fit" gutterSize="10px" cols="6">
            <mat-grid-tile colspan="3">
                <mat-card>1.1</mat-card>
            </mat-grid-tile>
            <mat-grid-tile colspan="3">1.2</mat-grid-tile>
            <mat-grid-tile colspan="3">1.3</mat-grid-tile>
            <mat-grid-tile colspan="3">1.4</mat-grid-tile>

            <mat-grid-tile colspan="2">2.1</mat-grid-tile>
            <mat-grid-tile colspan="2">2.2</mat-grid-tile>
            <mat-grid-tile colspan="2">2.3</mat-grid-tile>
        </mat-grid-list>
    </mat-sidenav-content>
</mat-sidenav-container>
