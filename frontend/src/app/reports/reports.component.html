<div
    id="user-reports-wrapper"
    *ngIf="{
        selectedUserReport: selectedUserReport$ | async
    } as asyncData"
>
    <mat-grid-list rowHeight="fit" gutterSize="15px" cols="6">
        <mat-grid-tile colspan="6">
            <mat-card
                >{{ asyncData.selectedUserReport.reportName }}
                {{ asyncData.selectedUserReport.reportContent }}
            </mat-card>
        </mat-grid-tile>
    </mat-grid-list>
</div>
