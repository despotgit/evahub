<mat-list>
    <mat-card *ngFor="let mo of menuOptions">
        selectedDocumentId is:
        {{ selectedDocumentId }}
        mo.id is:
        {{ mo.id }}
        <mat-list-item
            [ngStyle]="
                selectedDocumentId == mo.id
                    ? { 'background-color': 'green' }
                    : { 'background-color': 'red' }
            "
            (click)="menuItemClicked(mo.id)"
            class="sidenav-menu-item"
        >
            {{ mo.label }}
        </mat-list-item>
    </mat-card>
</mat-list>
