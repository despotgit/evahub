<mat-icon
    [ngClass]="isInNewDocumentMode() ? 'add-new-icon-selected' : 'add-new-icon-unselected'"
    (click)="uploadNewDocumentClicked()"
    >add_circle</mat-icon
>

<mat-list *ngIf="!shouldDisplaySpinner">
    <mat-card
        *ngFor="let mo of menuItems"
        [ngClass]="selectedDocumentId == mo.id ? 'selected-menu-item' : 'unselected-menu-item'"
    >
        <mat-list-item (click)="menuItemClicked(mo.id)" class="sidenav-menu-item">
            <div class="elements-wrapper">
                <div class="document-name">{{ mo.id }} {{ mo.label }}</div>
                <span class="buttons-wrapper">
                    <div class="request-report-button" (click)="requestReportClicked(mo.id)">
                        <span title="Request report" class="material-icons">assignment</span>
                    </div>
                    <div class="delete-document" (click)="deleteClicked(mo.id)">
                        <!-- <mat-icon>delete</mat-icon>  -->
                        <span title="Delete document" class="material-icons">delete</span>
                    </div>
                </span>
            </div>
        </mat-list-item>
    </mat-card>
</mat-list>
<div class="spinner-wrapper" *ngIf="shouldDisplaySpinner">
    <evahub-gears-spinner [gearsSpinnerWidth]="150"></evahub-gears-spinner>
</div>

<form *ngIf="false" action="/" id="my-sample-form">
    <!-- <input type="hidden" name="payment_method_nonce" />  -->
    <input name="payment_method_nonce" />
    <label for="card-number">Card Number</label>
    <div id="card-number"></div>

    <label for="cvv">CVV</label>
    <div id="cvv"></div>

    <label for="expiration-date">Expiration Date</label>
    <div id="expiration-date"></div>

    <input id="my-submit" type="submit" value="Pay" />
</form>
