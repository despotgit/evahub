<div
    id="user-checks-wrapper"
    *ngIf="{
        selectedUserCheck: selectedUserChecks$ | async
    } as asyncData"
>
    <mat-grid-list rowHeight="fit" gutterSize="15px" cols="6">
        <mat-grid-tile colspan="6">
            <mat-card>
                {{ asyncData.selectedUserCheck.checkContent }}
            </mat-card>
        </mat-grid-tile>
    </mat-grid-list>
</div>
